<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background -->
  <rect width="64" height="64" rx="12" fill="#121110"/>
  <!-- Subtle border ring -->
  <rect x="2" y="2" width="60" height="60" rx="10" stroke="#3a3530" stroke-width="1"/>
  <!-- Outer decorative square frame -->
  <rect x="10" y="10" width="44" height="44" rx="6" stroke="#2a2520" stroke-width="0.75"/>
  <!-- Stylized "Z" formed by 3 strokes -->
  <!-- Top horizontal bar -->
  <line x1="18" y1="19" x2="46" y2="19" stroke="#c9a96e" stroke-width="5" stroke-linecap="square"/>
  <!-- Diagonal stroke (top-right to bottom-left) -->
  <line x1="46" y1="19" x2="18" y2="45" stroke="#c9a96e" stroke-width="5" stroke-linecap="square"/>
  <!-- Bottom horizontal bar -->
  <line x1="18" y1="45" x2="46" y2="45" stroke="#c9a96e" stroke-width="5" stroke-linecap="square"/>
</svg>
